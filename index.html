<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Literature Quiz Universe ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-purple: #b026ff;
            --deep-purple: #4a0080;
            --electric-violet: #8b00ff;
            --mystic-lavender: #e6e6fa;
            --cosmic-pink: #ff00ff;
            --star-gold: #ffd700;
            --void-black: #0d001a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--void-black);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Starfield Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--neon-purple);
            top: -200px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--cosmic-pink);
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--electric-violet);
            top: 50%;
            left: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(0, -100px) scale(0.9); }
            75% { transform: translate(-50px, -50px) scale(1.05); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-box {
            background: rgba(13, 0, 26, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-purple);
            border-radius: 30px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            box-shadow: 
                0 0 50px rgba(176, 38, 255, 0.3),
                inset 0 0 50px rgba(176, 38, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .quiz-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-purple), var(--cosmic-pink), var(--electric-violet), var(--neon-purple));
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .quiz-box:hover::before {
            opacity: 0.5;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Typography */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5em;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, var(--neon-purple), var(--cosmic-pink), var(--star-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: titlePulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(176, 38, 255, 0.5);
        }

        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .subtitle {
            text-align: center;
            color: var(--mystic-lavender);
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* Category Selection */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .category-card {
            background: linear-gradient(135deg, rgba(176, 38, 255, 0.1), rgba(139, 0, 255, 0.1));
            border: 2px solid var(--electric-violet);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .category-card:hover::before {
            left: 100%;
        }

        .category-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--cosmic-pink);
            box-shadow: 
                0 20px 40px rgba(176, 38, 255, 0.4),
                0 0 60px rgba(255, 0, 255, 0.2);
        }

        .category-icon {
            font-size: 3.5em;
            margin-bottom: 15px;
            display: block;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .category-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4em;
            color: var(--mystic-lavender);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .category-desc {
            color: rgba(230, 230, 250, 0.7);
            font-size: 0.9em;
        }

        /* Quiz Interface */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 12px;
            background: rgba(176, 38, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--cosmic-pink), var(--star-gold));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-purple);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .question-counter {
            text-align: center;
            color: var(--cosmic-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .question {
            font-size: 1.6em;
            color: var(--mystic-lavender);
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 600;
            text-align: center;
            padding: 20px;
            background: rgba(176, 38, 255, 0.1);
            border-radius: 15px;
            border-left: 5px solid var(--neon-purple);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            background: rgba(176, 38, 255, 0.1);
            border: 2px solid var(--electric-violet);
            border-radius: 15px;
            padding: 20px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--mystic-lavender);
            font-size: 1.1em;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--neon-purple), transparent);
            transition: width 0.3s;
            z-index: -1;
        }

        .option:hover::before {
            width: 100%;
        }

        .option:hover {
            transform: translateX(10px);
            border-color: var(--cosmic-pink);
            box-shadow: 0 5px 20px rgba(176, 38, 255, 0.3);
        }

        .option.correct {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border-color: #00ff88;
            color: #003311;
            animation: correctBurst 0.6s ease;
            font-weight: 700;
        }

        .option.wrong {
            background: linear-gradient(135deg, #ff3366, #cc0044);
            border-color: #ff3366;
            color: white;
            animation: shake 0.5s ease;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes correctBurst {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #00ff88; }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* Feedback Section */
        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            display: none;
            animation: feedbackSlide 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        @keyframes feedbackSlide {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .feedback.correct-feedback {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 204, 106, 0.2));
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .feedback.wrong-feedback {
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(204, 0, 68, 0.2));
            border: 3px solid #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
        }

        .feedback-icon {
            font-size: 3em;
            display: block;
            margin-bottom: 10px;
            animation: iconBounce 0.6s ease infinite alternate;
        }

        @keyframes iconBounce {
            from { transform: scale(1) rotate(-5deg); }
            to { transform: scale(1.2) rotate(5deg); }
        }

        .feedback-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .correct-feedback .feedback-text {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }

        .wrong-feedback .feedback-text {
            color: #ff3366;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
        }

        /* Buttons */
        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-purple), var(--electric-violet));
            color: white;
            box-shadow: 0 10px 30px rgba(176, 38, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(176, 38, 255, 0.6);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            display: none;
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--electric-violet);
            color: var(--mystic-lavender);
            padding: 12px 25px;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--electric-violet);
            color: white;
        }

        /* Results Screen */
        .results-container {
            text-align: center;
            display: none;
        }

        .trophy {
            font-size: 6em;
            margin-bottom: 20px;
            display: inline-block;
            animation: trophyGlow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--star-gold));
        }

        @keyframes trophyGlow {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 20px var(--star-gold)); }
            50% { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 40px var(--cosmic-pink)); }
        }

        .score-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-purple), var(--cosmic-pink), var(--star-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            animation: scorePulse 1.5s ease-in-out infinite;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .result-message {
            color: var(--mystic-lavender);
            font-size: 1.4em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Particle Effects */
        .particle {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        @keyframes particleExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .quiz-box { padding: 30px 20px; }
            .category-grid { grid-template-columns: 1fr; }
            .question { font-size: 1.2em; }
            .score-display { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="stars" id="starfield"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="quiz-box">
            
            <!-- CATEGORY SELECTION SCREEN -->
            <div id="categoryScreen" class="fade-in">
                <h1>📚 Quiz Universe</h1>
                <p class="subtitle">Choose your literary destiny...</p>
                
                <div class="category-grid">
                    <div class="category-card" onclick="startCategory('asian')">
                        <span class="category-icon">🌏</span>
                        <div class="category-title">Asian Literature</div>
                        <div class="category-desc">All traditions combined</div>
                    </div>
                    
                    <div class="category-card" onclick="startCategory('chinese')">
                        <span class="category-icon">🐉</span>
                        <div class="category-title">Chinese Literature</div>
                        <div class="category-desc">Tang Dynasty & Poetry</div>
                    </div>
                    
                    <div class="category-card" onclick="startCategory('japanese')">
                        <span class="category-icon">🌸</span>
                        <div class="category-title">Japanese Literature</div>
                        <div class="category-desc">Haiku, Mythology & More</div>
                    </div>
                    
                    <div class="category-card" onclick="startCategory('korean')">
                        <span class="category-icon">🎎</span>
                        <div class="category-title">Korean Literature</div>
                        <div class="category-desc">Sijo, Hangul & History</div>
                    </div>
                    
                    <div class="category-card" onclick="startCategory('indian')">
                        <span class="category-icon">🕉️</span>
                        <div class="category-title">Indian Literature</div>
                        <div class="category-desc">Vedas, Epics & Tagore</div>
                    </div>
                </div>
            </div>

            <!-- QUIZ SCREEN -->
            <div id="quizScreen" class="hidden">
                <button class="btn back-btn" onclick="backToCategories()">← Back</button>
                
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                
                <div class="question-counter" id="questionCounter">Question 1 / 5</div>
                <div class="question" id="questionText"></div>
                
                <div class="options" id="optionsContainer"></div>
                
                <div class="feedback" id="feedback">
                    <span class="feedback-icon" id="feedbackIcon"></span>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>
                
                <button class="btn btn-primary next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>

            <!-- RESULTS SCREEN -->
            <div id="resultsScreen" class="results-container hidden">
                <div class="trophy" id="trophyIcon">🏆</div>
                <div class="score-display" id="scoreDisplay">0/5</div>
                <div class="result-message" id="resultMessage"></div>
                <button class="btn btn-primary" onclick="backToCategories()">Choose New Quiz ↺</button>
            </div>

        </div>
    </div>

    <script>

                { q: "A Sijo is:", options: ["A five-line poem", "A three-line poem", "A ten-line poem", "A novel"], correct: 1 },
                { q: "Hyangga are:", options: ["Modern pop songs", "Native songs with religious themes", "Foreign translations", "Military marches"], correct: 1 },
                { q: "Korean literature emphasizes:", options: ["Only comedy", "Emotional expression and loyalty", "Science fiction", "Western themes"], correct: 1 },
                { q: "Seo Jeong-ju was influenced by:", options: ["Only Christianity", "Buddhism and folklore", "Greek mythology", "American pop culture"], correct: 1 },
                { q: "Pyŏlgok focuses on:", options: ["War and politics only", "Love, longing, and emotional struggle", "Cooking recipes", "Sports"], correct: 1 },
                { q: "Kasa are:", options: ["Short poems", "Long narrative poems", "One-word answers", "Musical instruments"], correct: 1 },
                { q: "Modern Korean stories often draw from:", options: ["Only American TV", "Ancient history and mythology", "European fairy tales", "Scientific journals"], correct: 1 },
                { q: "Korean literature reflects:", options: ["Only modern values", "Confucian values and human emotions", "Abstract mathematics", "Animal behavior"], correct: 1 }
            ],
            indian: [
                { q: "The Vedas are:", options: ["Modern novels", "Oldest sacred texts of Hinduism", "Islamic texts", "Buddhist prayers"], correct: 1 },
                { q: "The Upanishads focus on:", options: ["Cooking techniques", "Philosophy of existence and self", "War strategies", "Building construction"], correct: 1 },
                { q: "The Mahabharata explores:", options: ["Only romance", "Duty (dharma), war, and morality", "Comedy", "Sports"], correct: 1 },
                { q: "The Ramayana focuses on:", options: ["Loyalty, honor, and ideal leadership", "Cooking", "Mathematics", "Science"], correct: 0 },
                { q: "Rabindranath Tagore won the Nobel Prize in:", options: ["1901", "1913", "1920", "1930"], correct: 1 },
                { q: "Tagore was the first Asian to win:", options: ["Peace Prize", "Literature Nobel", "Physics Nobel", "Medicine Nobel"], correct: 1 },
                { q: "Indian literature is deeply connected to:", options: ["Only politics", "Religion, philosophy, and moral teachings", "Modern technology", "Western culture"], correct: 1 },
                { q: "The Brahmanas explain:", options: ["Rituals and sacrifices", "Modern science", "Foreign languages", "Art techniques"], correct: 0 },
                { q: "Dharma in Indian literature refers to:", options: ["Duty and righteousness", "Wealth", "Pleasure", "Liberation only"], correct: 0 },
                { q: "Indian epics are written in:", options: ["Only English", "Sanskrit and regional languages", "Chinese", "Greek"], correct: 1 }
            ]
        };

        let currentCategory = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Create starfield
        function createStars() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                starfield.appendChild(star);
            }
        }

        createStars();

        function startCategory(category) {
            currentCategory = category;
            currentQuestions = shuffleArray([...questionBanks[category]]).slice(0, 5);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('categoryScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');
            
            loadQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            answered = false;
            const q = currentQuestions[currentQuestionIndex];
            
            document.getElementById('questionCounter').textContent = 
                `Question ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('questionText').textContent = q.q;
            
            const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'none';
            feedback.className = 'feedback';
            document.getElementById('nextBtn').style.display = 'none';
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(idx);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selectedIdx) {
            if (answered) return;
            answered = true;
            
            const q = currentQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            
            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === q.correct) {
                    opt.classList.add('correct');
                }
            });
            
            if (selectedIdx === q.correct) {
                score++;
                options[selectedIdx].classList.add('correct');
                createParticles(options[selectedIdx], '#00ff88');
                
                feedback.innerHTML = `
                    <span class="feedback-icon">✨💖</span>
                    <div class="feedback-text">Good Job, Baby</div>
                `;
                feedback.className = 'feedback correct-feedback';
            } else {
                options[selectedIdx].classList.add('wrong');
                createParticles(options[selectedIdx], '#ff3366');
                
                feedback.innerHTML = `
                    <span class="feedback-icon">😢💔</span>
                    <div class="feedback-text">Wrong Answer Baby :(</div>
                `;
                feedback.className = 'feedback wrong-feedback';
            }
            
            feedback.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
            
            // Update progress
            const progress = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function createParticles(element, color) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = rect.left + rect.width / 2 + 'px';
                particle.style.top = rect.top + rect.height / 2 + 'px';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.background = color;
                particle.style.borderRadius = '50%';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
                particle.style.animation = 'particleExplode 0.8s ease forwards';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            
            const percentage = (score / currentQuestions.length) * 100;
            document.getElementById('scoreDisplay').textContent = `${score}/${currentQuestions.length}`;
            
            let message = '';
            let trophy = '';
            
            if (percentage === 100) {
                trophy = '👑';
                message = 'PERFECT SCORE! You are a Literary Legend! 🌟✨';
                createConfetti();
            } else if (percentage >= 80) {
                trophy = '🏆';
                message = 'Amazing! You really know your stuff! 📚✨';
            } else if (percentage >= 60) {
                trophy = '🥈';
                message = 'Great job! Keep learning! 💪';
            } else if (percentage >= 40) {
                trophy = '📖';
                message = 'Not bad! Study a bit more! 📚';
            } else {
                trophy = '💝';
                message = 'Keep trying! You will get there! 🌱';
            }
            
            document.getElementById('trophyIcon').textContent = trophy;
            document.getElementById('resultMessage').textContent = message;
        }

        function createConfetti() {
            const colors = ['#b026ff', '#ff00ff', '#ffd700', '#00ff88', '#ff3366'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                    confetti.style.zIndex = '1000';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Add confetti animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confetti-fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        function backToCategories() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('categoryScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
