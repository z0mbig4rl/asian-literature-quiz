<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spot the Duck</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #020617;
            overflow-y: auto;
            overflow-x: hidden;
        }

        body.game-active {
            overflow: hidden;
        }

        @keyframes radar-pulse {
            0% { transform: scale(0.3); opacity: 0.9; }
            50% { opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .radar-effect {
            animation: radar-pulse 1.8s infinite ease-out;
        }

        @keyframes duck-pop {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .duck-found-anim {
            animation: duck-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="flex flex-col font-sans antialiased select-none bg-slate-950 min-h-full">

    <!-- Standard Quack & Easter Duck Audio Elements -->
    <audio id="sfx-quack" preload="auto" src="duck.mp3"></audio>
    <audio id="sfx-easter1" preload="auto" src="easterduck1.mp3"></audio>
    <audio id="sfx-easter2" preload="auto" src="easterduck2.mp3"></audio>
    <audio id="sfx-easter3" preload="auto" src="easterduck3.mp3"></audio>
    <audio id="sfx-easter4" preload="auto" src="easterduck4.mp3"></audio>
    <audio id="sfx-easter5" preload="auto" src="easterduck5.mp3"></audio>

    <header class="bg-slate-800/95 border-b border-slate-700 px-3 py-2 flex items-center justify-between z-30 shadow-md shrink-0 sticky top-0">
        <div class="flex items-center space-x-2">
            <button id="btn-back-menu" class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-slate-200 hidden flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Menu</span>
            </button>
            <h1 class="text-base sm:text-xl font-black tracking-tight text-amber-400 flex items-center gap-1.5">
                <span>🦆</span> SPOT THE DUCKIES
            </h1>
        </div>

        <div id="game-stats" class="hidden flex items-center gap-2">
            <div class="flex items-center gap-1 bg-slate-900/80 px-2 py-1 rounded-full border border-slate-700">
                <i data-lucide="target" class="w-3 h-3 text-amber-400"></i>
                <span id="duck-counter" class="text-xs font-bold text-amber-400">0 / 0</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-900/80 px-2 py-1 rounded-full border border-slate-700">
                <i data-lucide="clock" class="w-3 h-3 text-cyan-400"></i>
                <span id="game-timer" class="text-xs font-mono font-bold text-cyan-400">00:00</span>
            </div>
        </div>

        <!-- In-Game Music & Volume Controls -->
        <div class="flex items-center gap-1.5">
            <button id="btn-game-play" title="Play Music" class="p-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-500 transition hidden">
                <i data-lucide="play" class="w-4 h-4 fill-current"></i>
            </button>
            <button id="btn-game-pause" title="Pause Music" class="p-1.5 rounded-lg bg-rose-600 text-white hover:bg-rose-500 transition hidden">
                <i data-lucide="pause" class="w-4 h-4 fill-current"></i>
            </button>
            <button id="btn-toggle-music" title="Toggle YouTube Music Mute" class="p-1.5 rounded-lg bg-slate-700 text-amber-400 hover:bg-slate-600 transition flex items-center gap-1 px-2 text-xs font-bold">
                <i id="icon-music" data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative bg-slate-950 flex flex-col items-center justify-center p-2 min-h-[calc(100vh-50px)]">

        <!-- Hidden YouTube Player Container (Loads API without hiding audio) -->
        <div class="hidden">
            <div id="youtube-player"></div>
        </div>

        <!-- Home Screen -->
        <div id="view-home" class="absolute inset-0 z-30 bg-slate-950 flex flex-col items-center justify-center p-4 text-center">
            <div class="max-w-md w-full space-y-4">
                <div class="space-y-1">
                    <div class="text-5xl sm:text-6xl animate-bounce">🦆</div>
                    <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Spot mo duckiess</h2>
                    <p class="text-slate-400 text-xs">Hanap hanappp ikaww duckiess hereee</p>
                </div>

                <!-- YouTube Controls on Home -->
                <div class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg space-y-2">
                    <p class="text-xs text-amber-400 font-bold">🎵 The Duck Song</p>
                    <div class="flex gap-2">
                        <button id="btn-yt-play" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 transition">
                            <i data-lucide="play" class="w-4 h-4 fill-current"></i> Play Song
                        </button>
                        <button id="btn-yt-pause" class="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 transition">
                            <i data-lucide="pause" class="w-4 h-4 fill-current"></i> Pause Song
                        </button>
                    </div>
                </div>

                <button id="btn-play-now" class="w-full py-3 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 text-slate-950 font-black text-lg rounded-2xl shadow-xl active:scale-95 transition duration-200 flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-5 h-5 fill-slate-950"></i> PLAY NOW GRRRR
                </button>
            </div>
        </div>

        <!-- Level Select View -->
        <div id="view-level-select" class="absolute inset-0 z-20 hidden overflow-y-auto p-4 flex flex-col items-center justify-center">
            <div class="max-w-md w-full space-y-3 my-auto py-6">
                <h2 class="text-2xl font-extrabold text-white text-center">Select ikaw lebel</h2>
                <div id="level-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </div>
        </div>

        <!-- Gameplay View -->
        <div id="view-gameplay" class="absolute inset-0 z-10 hidden flex flex-col items-center justify-center">
            <div class="absolute top-2 left-2 z-20">
                <button id="btn-hint" class="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded-lg shadow flex items-center gap-1 text-xs">
                    <i data-lucide="sparkles" class="w-3 h-3"></i> Hint (<span id="hint-count">3</span>)
                </button>
            </div>

            <div class="relative flex items-center justify-center w-full h-full p-2">
                <div id="game-board" class="relative flex items-center justify-center max-w-[95vw] max-h-[75vh]">
                    <img id="level-image" src="" alt="Level Background" class="max-w-[95vw] max-h-[72vh] object-contain rounded-xl shadow-2xl border border-slate-800" draggable="false" />
                    <div id="ducks-layer" class="absolute pointer-events-auto"></div>
                    <div id="radar-signal" class="absolute hidden pointer-events-none -translate-x-1/2 -translate-y-1/2 w-14 h-14">
                        <div class="w-full h-full rounded-full border-2 border-amber-400 bg-amber-400/20 radar-effect"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Win Modal -->
    <div id="modal-win" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-5 text-center shadow-2xl space-y-4">
            <div class="text-5xl animate-bounce">🎉</div>
            <div>
                <h3 class="text-xl font-black text-white">GOOD JOBB MYYY BEBEEEE</h3>
                <p class="text-slate-400 text-xs mt-1">NAHANAP MO ALL DUCKIES</p>
            </div>
            <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                <div>
                    <span class="text-[10px] text-slate-400 block">Time</span>
                    <span id="win-time-stat" class="text-sm font-bold text-cyan-400 font-mono">00:00</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 block">Found</span>
                    <span id="win-ducks-stat" class="text-sm font-bold text-amber-400">0</span>
                </div>
            </div>
            <div class="flex gap-2 pt-1">
                <button id="btn-win-replay" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-xs">Wepway</button>
                <button id="btn-win-next" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">Next one</button>
            </div>
        </div>
    </div>

    <script>
        let ytPlayer;
        let isMusicMuted = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '9Ws0Sq-96dY',
                playerVars: { 'playsinline': 1, 'autoplay': 0 }
            });
        }

        const SVG_FALLBACKS = [
            'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="300" fill="%2338bdf8"/><circle cx="700" cy="80" r="40" fill="%23fde047"/><ellipse cx="150" cy="320" rx="250" ry="120" fill="%234ade80"/><ellipse cx="650" cy="320" rx="300" ry="140" fill="%2315803d"/><rect y="280" width="800" height="220" fill="%2322c55e"/></svg>',
            'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="350" fill="%23fb923c"/><circle cx="400" cy="250" r="140" fill="%23facc15"/><rect y="320" width="800" height="180" fill="%230284c7"/></svg>',
            'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="%23065f46"/><path d="M 0 250 L 150 120 L 350 250 L 550 80 L 750 220 L 800 200 L 800 500 L 0 500 Z" fill="%23047857"/></svg>',
            'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="%231e1b4b"/><circle cx="150" cy="120" r="30" fill="%23fef08a"/><rect y="380" width="800" height="120" fill="%23312e81"/></svg>'
        ];

        const UNSPLASH_FALLBACKS = [
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1511497584788-876761c11969?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1000&q=80'
        ];

        const LEVELS_CONFIG = [
            { id: "level1", title: "Level 1", image: "background/level1.jpg", fallbackImage: "background/level1.png", unsplash: UNSPLASH_FALLBACKS[0], svg: SVG_FALLBACKS[0] },
            { id: "level2", title: "Level 2", image: "background/level2.jpg", fallbackImage: "background/level2.png", unsplash: UNSPLASH_FALLBACKS[1], svg: SVG_FALLBACKS[1] },
            { id: "level3", title: "Level 3", image: "background/level3.jpg", fallbackImage: "background/level3.png", unsplash: UNSPLASH_FALLBACKS[2], svg: SVG_FALLBACKS[2] },
            { id: "level4", title: "Level 4", image: "background/level4.jpg", fallbackImage: "background/level4.png", unsplash: UNSPLASH_FALLBACKS[3], svg: SVG_FALLBACKS[3] }
        ];

        let currentLevel = null;
        let generatedDucks = [];
        let foundDucks = new Set();
        let hintsRemaining = 3;
        let timerInterval = null;
        let secondsElapsed = 0;

        const DOM = {
            sfxQuack: document.getElementById('sfx-quack'),
            easterAudios: [
                document.getElementById('sfx-easter1'),
                document.getElementById('sfx-easter2'),
                document.getElementById('sfx-easter3'),
                document.getElementById('sfx-easter4'),
                document.getElementById('sfx-easter5')
            ],
            btnYtPlay: document.getElementById('btn-yt-play'),
            btnYtPause: document.getElementById('btn-yt-pause'),
            btnGamePlay: document.getElementById('btn-game-play'),
            btnGamePause: document.getElementById('btn-game-pause'),
            btnToggleMusic: document.getElementById('btn-toggle-music'),
            iconMusic: document.getElementById('icon-music'),
            viewHome: document.getElementById('view-home'),
            viewLevelSelect: document.getElementById('view-level-select'),
            viewGameplay: document.getElementById('view-gameplay'),
            btnPlayNow: document.getElementById('btn-play-now'),
            levelGrid: document.getElementById('level-grid'),
            btnBackMenu: document.getElementById('btn-back-menu'),
            gameStats: document.getElementById('game-stats'),
            duckCounter: document.getElementById('duck-counter'),
            gameTimer: document.getElementById('game-timer'),
            levelImage: document.getElementById('level-image'),
            ducksLayer: document.getElementById('ducks-layer'),
            radarSignal: document.getElementById('radar-signal'),
            btnHint: document.getElementById('btn-hint'),
            hintCount: document.getElementById('hint-count'),
            modalWin: document.getElementById('modal-win'),
            winTimeStat: document.getElementById('win-time-stat'),
            winDucksStat: document.getElementById('win-ducks-stat'),
            btnWinReplay: document.getElementById('btn-win-replay'),
            btnWinNext: document.getElementById('btn-win-next')
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderLevelGrid();
            setupEventListeners();
        });

        function setupEventListeners() {
            const playMusic = () => { if (ytPlayer && typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo(); };
            const pauseMusic = () => { if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo(); };

            DOM.btnYtPlay.addEventListener('click', playMusic);
            DOM.btnYtPause.addEventListener('click', pauseMusic);
            DOM.btnGamePlay.addEventListener('click', playMusic);
            DOM.btnGamePause.addEventListener('click', pauseMusic);

            DOM.btnPlayNow.addEventListener('click', () => {
                DOM.viewHome.classList.add('hidden');
                document.body.classList.add('game-active');
                DOM.btnGamePlay.classList.remove('hidden');
                DOM.btnGamePause.classList.remove('hidden');
                startLevel(LEVELS_CONFIG[0].id);
            });

            DOM.btnToggleMusic.addEventListener('click', toggleYouTubeMusic);
            DOM.btnBackMenu.addEventListener('click', showLevelSelect);
            DOM.btnHint.addEventListener('click', triggerHint);

            DOM.btnWinReplay.addEventListener('click', () => {
                DOM.modalWin.classList.add('hidden');
                startLevel(currentLevel.id);
            });
            DOM.btnWinNext.addEventListener('click', () => {
                DOM.modalWin.classList.add('hidden');
                const currentIndex = LEVELS_CONFIG.findIndex(l => l.id === currentLevel.id);
                const nextIndex = (currentIndex + 1) % LEVELS_CONFIG.length;
                startLevel(LEVELS_CONFIG[nextIndex].id);
            });

            window.addEventListener('resize', fitDucksToImage);
        }

        function toggleYouTubeMusic() {
            if (!ytPlayer || typeof ytPlayer.mute !== 'function') return;
            isMusicMuted = !isMusicMuted;
            if (isMusicMuted) {
                ytPlayer.mute();
                DOM.btnToggleMusic.classList.add('opacity-50');
                DOM.iconMusic.setAttribute('data-lucide', 'volume-x');
            } else {
                ytPlayer.unMute();
                DOM.btnToggleMusic.classList.remove('opacity-50');
                DOM.iconMusic.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        }

        function renderLevelGrid() {
            DOM.levelGrid.innerHTML = '';
            LEVELS_CONFIG.forEach((level, index) => {
                const bestTime = localStorage.getItem(`spot_duck_best_${level.id}`);
                const isCompleted = localStorage.getItem(`spot_duck_completed_${level.id}`) === 'true';

                const card = document.createElement('div');
                card.className = 'bg-slate-800/80 border border-slate-700/80 rounded-xl overflow-hidden shadow-md hover:border-amber-400 transition flex flex-col group cursor-pointer';
                
                card.innerHTML = `
                    <div class="relative h-28 bg-slate-900 overflow-hidden">
                        <img src="${level.image}" alt="${level.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" 
                             onerror="this.onerror=null; this.src='${level.unsplash}';">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
                        ${isCompleted ? `
                            <div class="absolute top-2 right-2 bg-emerald-500 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full flex items-center gap-0.5 shadow">
                                <i data-lucide="check-circle" class="w-3 h-3"></i> Cleared
                            </div>
                        ` : ''}
                        <div class="absolute bottom-2 left-2 right-2">
                            <span class="text-[10px] font-bold text-amber-400 uppercase">Level ${index + 1}</span>
                            <h3 class="text-sm font-extrabold text-white">${level.title}</h3>
                        </div>
                    </div>
                    <div class="p-2.5 bg-slate-800 flex justify-between items-center text-xs text-slate-400">
                        <span>Best: <strong class="text-slate-200 font-mono">${bestTime ? formatTime(parseInt(bestTime)) : '--:--'}</strong></span>
                        <button class="px-3 py-1 bg-amber-500 text-slate-950 font-black rounded-lg transition">PLAY</button>
                    </div>
                `;

                card.addEventListener('click', () => startLevel(level.id));
                DOM.levelGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        function startLevel(levelId) {
            currentLevel = LEVELS_CONFIG.find(l => l.id === levelId);
            if (!currentLevel) return;

            const count = Math.floor(Math.random() * 3) + 5; 
            generatedDucks = [];

            for (let i = 0; i < count; i++) {
                generatedDucks.push({
                    x: Math.floor(Math.random() * 60) + 20,
                    y: Math.floor(Math.random() * 60) + 20,
                    size: Math.floor(Math.random() * 4) + 22
                });
            }

            foundDucks.clear();
            hintsRemaining = 3;
            secondsElapsed = 0;

            DOM.duckCounter.textContent = `0 / ${generatedDucks.length}`;
            DOM.hintCount.textContent = hintsRemaining;
            DOM.btnHint.disabled = false;

            DOM.viewLevelSelect.classList.add('hidden');
            DOM.viewGameplay.classList.remove('hidden');
            DOM.btnBackMenu.classList.remove('hidden');
            DOM.gameStats.classList.remove('hidden');

            DOM.levelImage.src = currentLevel.image;
            DOM.levelImage.onerror = () => {
                if (DOM.levelImage.src.includes('.jpg')) {
                    DOM.levelImage.src = currentLevel.fallbackImage;
                } else if (!DOM.levelImage.src.includes('unsplash')) {
                    DOM.levelImage.src = currentLevel.unsplash;
                } else {
                    DOM.levelImage.src = currentLevel.svg;
                }
            };

            DOM.levelImage.onload = () => {
                fitDucksToImage();
            };

            renderDucks();
            startTimer();
        }

        function fitDucksToImage() {
            setTimeout(() => {
                const rect = DOM.levelImage.getBoundingClientRect();
                DOM.ducksLayer.style.width = `${rect.width}px`;
                DOM.ducksLayer.style.height = `${rect.height}px`;
                DOM.ducksLayer.style.top = `${DOM.levelImage.offsetTop}px`;
                DOM.ducksLayer.style.left = `${DOM.levelImage.offsetLeft}px`;
            }, 50);
        }

        function showLevelSelect() {
            stopTimer();
            document.body.classList.remove('game-active');
            DOM.btnGamePlay.classList.add('hidden');
            DOM.btnGamePause.classList.add('hidden');
            DOM.viewGameplay.classList.add('hidden');
            DOM.viewLevelSelect.classList.remove('hidden');
            DOM.btnBackMenu.classList.add('hidden');
            DOM.gameStats.classList.add('hidden');
            renderLevelGrid();
        }

        function renderDucks() {
            DOM.ducksLayer.innerHTML = '';
            fitDucksToImage();

            generatedDucks.forEach((duck, index) => {
                const duckEl = document.createElement('div');
                duckEl.className = 'absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-200 hover:scale-125';
                duckEl.style.left = `${duck.x}%`;
                duckEl.style.top = `${duck.y}%`;
                duckEl.style.width = `${duck.size}px`;
                duckEl.style.height = `${duck.size}px`;

                duckEl.innerHTML = `
                    <div class="w-full h-full drop-shadow-md">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                            <path d="M12 36C12 28 20 24 32 24C44 24 54 30 54 40C54 48 44 52 32 52C18 52 12 46 12 36Z" fill="#FACC15"/>
                            <path d="M10 38C10 30 18 26 30 26C38 26 44 28 48 32C42 34 38 40 38 48C24 48 10 46 10 38Z" fill="#EAB308"/>
                            <circle cx="44" cy="20" r="12" fill="#FACC15"/>
                            <path d="M52 20C52 20 62 21 60 25C58 29 50 26 50 26Z" fill="#F97316"/>
                            <circle cx="46" cy="18" r="2.5" fill="#0F172A"/>
                        </svg>
                    </div>
                `;

                duckEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onDuckClicked(index, duckEl);
                });

                DOM.ducksLayer.appendChild(duckEl);
            });
        }

        function onDuckClicked(index, element) {
            if (foundDucks.has(index)) return;
            foundDucks.add(index);
            
            playDuckSoundWithMusicInterruption();

            element.classList.add('duck-found-anim');
            element.innerHTML = `
                <div class="relative w-full h-full flex items-center justify-center">
                    <span class="text-xl drop-shadow-lg">🦆</span>
                    <div class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-slate-950 rounded-full p-0.5 shadow">
                        <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            `;

            DOM.duckCounter.textContent = `${foundDucks.size} / ${generatedDucks.length}`;
            if (foundDucks.size === generatedDucks.length) {
                setTimeout(handleWin, 500);
            }
        }

        // 50% Chance Easter Duck Logic with Audio Interruption
        function playDuckSoundWithMusicInterruption() {
            let soundToPlay;
            let isEaster = Math.random() < 0.50; // 50% chance

            if (isEaster) {
                const randomEaster = DOM.easterAudios[Math.floor(Math.random() * DOM.easterAudios.length)];
                soundToPlay = randomEaster;
            } else {
                soundToPlay = DOM.sfxQuack;
            }

            if (ytPlayer && typeof ytPlayer.mute === 'function' && !isMusicMuted) {
                ytPlayer.mute();
            }

            soundToPlay.currentTime = 0;
            soundToPlay.play().catch(() => {});

            soundToPlay.onended = () => {
                if (ytPlayer && typeof ytPlayer.unMute === 'function' && !isMusicMuted) {
                    ytPlayer.unMute();
                }
            };
        }

        function triggerHint() {
            if (hintsRemaining <= 0) return;
            const unfound = generatedDucks.map((_, i) => i).filter(i => !foundDucks.has(i));
            if (unfound.length === 0) return;

            const target = generatedDucks[unfound[Math.floor(Math.random() * unfound.length)]];
            DOM.radarSignal.style.left = `${target.x}%`;
            DOM.radarSignal.style.top = `${target.y}%`;
            DOM.radarSignal.classList.remove('hidden');

            hintsRemaining--;
            DOM.hintCount.textContent = hintsRemaining;
            if (hintsRemaining <= 0) DOM.btnHint.disabled = true;

            setTimeout(() => DOM.radarSignal.classList.add('hidden'), 3000);
        }

        function handleWin() {
            stopTimer();
            localStorage.setItem(`spot_duck_completed_${currentLevel.id}`, 'true');
            DOM.winTimeStat.textContent = formatTime(secondsElapsed);
            DOM.winDucksStat.textContent = generatedDucks.length.toString();
            DOM.modalWin.classList.remove('hidden');
            if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                DOM.gameTimer.textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function formatTime(totalSecs) {
            const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const secs = (totalSecs % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
    </script>
</body>
</html>
