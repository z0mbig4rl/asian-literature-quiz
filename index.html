<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Literature Quiz | 21st Century Lit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .quiz-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .question-counter {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .question {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            color: #444;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            background: #e3f2fd;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            animation: correctPulse 0.6s ease;
        }

        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            animation: shake 0.5s ease;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            display: none;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.correct-feedback {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .feedback.wrong-feedback {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .feedback-icon {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .results {
            display: none;
            text-align: center;
        }

        .results h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .result-message {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        .start-screen {
            text-align: center;
        }

        .start-screen p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* Confetti animation for perfect score */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="startScreen" class="start-screen">
            <h1>📚 Asian Literature Quiz</h1>
            <p>Test your knowledge of Chinese, Japanese, Korean, and Indian literature!<br>
            15 questions covering all the major traditions and works.</p>
            <button class="start-btn" onclick="startQuiz()">Start Quiz ▶</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="question-counter" id="questionCounter">Question 1 of 15</div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="results hidden">
            <h2>Quiz Complete! 🎉</h2>
            <div class="score-circle" id="scoreCircle">0/15</div>
            <div class="result-message" id="resultMessage"></div>
            <button class="restart-btn" onclick="restartQuiz()">Try Again ↺</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which dynasty is considered the Golden Age of Chinese poetry?",
                options: ["Han Dynasty", "Tang Dynasty (618-907 CE)", "Ming Dynasty", "Qing Dynasty"],
                correct: 1
            },
            {
                question: "Li Po (Li Bai) was primarily influenced by which philosophy?",
                options: ["Confucianism", "Legalism", "Daoism", "Buddhism"],
                correct: 2
            },
            {
                question: "What is the syllable structure of a traditional Haiku?",
                options: ["3-5-3", "5-7-5", "7-5-7", "5-5-5"],
                correct: 1
            },
            {
                question: "Who is considered the greatest master of Haiku?",
                options: ["Yosa Buson", "Kobayashi Issa", "Matsuo Basho", "Masaoka Shiki"],
                correct: 2
            },
            {
                question: "What does 'mono no aware' refer to in Japanese literature?",
                options: ["Warrior spirit", "Path of the sword", "Appreciation of impermanence", "Honor code"],
                correct: 2
            },
            {
                question: "Which writing system, invented in the 15th century, allowed Korean literature to flourish among common people?",
                options: ["Hanja", "Hangul", "Katakana", "Pinyin"],
                correct: 1
            },
            {
                question: "What is a Sijo in Korean literature?",
                options: ["A three-line poem", "A type of novel", "A historical record", "A musical instrument"],
                correct: 0
            },
            {
                question: "Who was the first Asian Nobel Prize winner in Literature (1913)?",
                options: ["Haruki Murakami", "Rabindranath Tagore", "Lu Xun", "Kazuo Ishiguro"],
                correct: 1
            },
            {
                question: "The Mahabharata primarily explores which concept?",
                options: ["Love and romance", "Duty (dharma), war, and morality", "Agricultural practices", "Sea exploration"],
                correct: 1
            },
            {
                question: "What are the oldest sacred texts of Hinduism?",
                options: ["Upanishads", "Puranas", "Vedas", "Brahmanas"],
                correct: 2
            },
            {
                question: "In 'The Story of an Aged Mother,' what law did the ruler impose?",
                options: ["All aged people must be abandoned", "All young men must join the army", "All families must pay extra taxes", "All women must work in fields"],
                correct: 0
            },
            {
                question: "Which Japanese mythological figures created the Japanese islands?",
                options: ["Amaterasu and Susano", "Izanagi and Izanami", "Tsukuyomi and Amaterasu", "Raijin and Fujin"],
                correct: 1
            },
            {
                question: "What is the main theme of 'The Story of an Aged Mother'?",
                options: ["War and conquest", "Filial piety and respect for elders", "Romantic love", "Economic prosperity"],
                correct: 1
            },
            {
                question: "Tu Fu (Du Fu) is known for which style of poetry?",
                options: ["Imaginative and romantic", "Realism and social responsibility", "Comedic and satirical", "Abstract and experimental"],
                correct: 1
            },
            {
                question: "Which of these is NOT a traditional Japanese theatrical form?",
                options: ["Noh", "Kabuki", "Peking Opera", "Bunraku"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function startQuiz() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            document.getElementById('questionCounter').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'none';
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(btn);
            });

            updateProgress();
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');

            options.forEach((opt, index) => {
                opt.classList.add('disabled');
                if (index === q.correct) {
                    opt.classList.add('correct');
                }
            });

            if (selectedIndex === q.correct) {
                score++;
                options[selectedIndex].classList.add('correct');
                feedback.innerHTML = '<span class="feedback-icon">✨🎉</span>Good Job, Baby';
                feedback.className = 'feedback correct-feedback';
            } else {
                options[selectedIndex].classList.add('wrong');
                feedback.innerHTML = '<span class="feedback-icon">😢💔</span>Wrong Answer Baby :(';
                feedback.className = 'feedback wrong-feedback';
            }

            feedback.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            
            const scoreCircle = document.getElementById('scoreCircle');
            const resultMessage = document.getElementById('resultMessage');
            
            scoreCircle.textContent = `${score}/${questions.length}`;
            
            let message = '';
            const percentage = (score / questions.length) * 100;
            
            if (percentage === 100) {
                message = "Perfect score! You're an Asian Literature expert! 🌟";
                createConfetti();
            } else if (percentage >= 80) {
                message = "Excellent work! You really know your literature! 📖✨";
            } else if (percentage >= 60) {
                message = "Good job! Keep studying those classics! 📚";
            } else if (percentage >= 40) {
                message = "Not bad! Room for improvement though! 💪";
            } else {
                message = "Time to hit the books! You can do better! 📖";
            }
            
            resultMessage.textContent = message;
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = ['#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b'][Math.floor(Math.random() * 5)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
